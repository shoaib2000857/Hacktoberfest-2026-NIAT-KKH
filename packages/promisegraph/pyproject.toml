[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "promisegraph"
version = "0.1.0"
description = "Evidence-aware claim comparison and provenance for AI investigations"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]
[tool.setuptools.packages.find]
where = ["src"]
